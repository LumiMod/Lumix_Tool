plugins {
    id 'com.android.application' version '8.9.2'
}

def keystorePropsFile = file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStorePath = System.getenv('LUMIX_KEYSTORE_PATH') ?: keystoreProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('LUMIX_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('LUMIX_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('LUMIX_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword') ?: releaseStorePassword
def releaseStoreFile = releaseStorePath ? file(releaseStorePath) : null
def hasReleaseSigning = releaseStoreFile != null && releaseStoreFile.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'tools.lumix.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'tools.lumix.mobile'
        minSdk 26
        targetSdk 35
        versionCode 403
        versionName '0.4.3'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/web')
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def bundleWeb = tasks.register('bundleWeb', Exec) {
    workingDir '../app'
    inputs.files(fileTree('../app/src'), '../app/index.html', '../app/package.json',
            '../app/package-lock.json', '../app/vite.config.mjs')
    outputs.dir layout.buildDirectory.dir('generated/web')
    if (System.getProperty('os.name').startsWith('Windows')) {
        commandLine 'cmd.exe', '/d', '/c', 'npm', 'run', 'build:android'
    } else {
        commandLine 'npm', 'run', 'build:android'
    }
}
tasks.named('preBuild').configure { dependsOn bundleWeb }
